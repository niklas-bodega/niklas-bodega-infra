  services:
    db:
      image: mysql:8.0
      container_name: bodega_db_local
      environment:
        MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
        MYSQL_DATABASE: ${DATABASE_NAME}
        MYSQL_USER: ${DATABASE_USERNAME}
        MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      ports:
        - "3307:3306"
      volumes:
        - bodega_db_data:/var/lib/mysql
      healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
        interval: 5s
        timeout: 5s
        retries: 5

    backend:
      build:
        context: ../backend
      container_name: bodega_backend_local
      ports:
        - "8081:8080"
      environment:
        - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${DATABASE_NAME}?allowPublicKeyRetrieval=true&useSSL=false
        - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME}
        - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}
        - GITHUBCLIENTID=${GITHUBCLIENTID}
        - GITHUBCLIENTSECRET=${GITHUBCLIENTSECRET}
        - GOOGLECLIENTID=${GOOGLECLIENTID}
        - GOOGLECLIENTSECRET=${GOOGLECLIENTSECRET}
        - APP_JWT_SECRET=${JWT_SECRET}
      depends_on:
        db:
          condition: service_healthy

    frontend:
      build:
        context: ../frontend
        args:
          - VITE_API_BASE_URL=http://localhost:8081
      container_name: bodega_frontend_local
      ports:
        - "8082:80"
      depends_on:
        - backend

  volumes:
    bodega_db_data:
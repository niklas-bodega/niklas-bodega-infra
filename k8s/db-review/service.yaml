apiVersion: v1
kind: Service
#DNS namnet i klustern som man kan använda.
#Om en annan pod vill nå review-databasen då behöver
#dom connecta till denna hostnamnet : db-review-service
#
metadata:
  name: db-review-service
spec:
  #selector kopplar samman dessa med resten av koden som ligger under app: db-review
  selector:
    app: db-review
  #anger vilken port dom övriga poddarna ska använda för att koppla till denna service.
  ports:
    - port: 3306
      targetPort: 3306